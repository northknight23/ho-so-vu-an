<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#141b26">
  <title>Hồ Sơ Vụ Án</title>
  <link rel="icon" href="assets/svg/icons/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Cả 4 font đều có bộ ký tự tiếng Việt. Mất mạng thì CSS tự lùi về font hệ thống. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lora:ital,wght@0,500;0,700;1,500&family=Patrick+Hand&family=Roboto+Mono:wght@400;600&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Toàn bộ giao diện được JS render vào #app theo hash route -->
  <main id="app" aria-live="polite">
    <div class="loading">Đang mở hồ sơ…</div>
  </main>

  <!-- Modal dùng chung: chi tiết manh mối, nghi phạm, điểm hiện trường, hộp xác nhận -->
  <dialog id="modal" class="modal" aria-labelledby="modal-title">
    <div class="modal__inner">
      <header class="modal__head">
        <h2 id="modal-title" class="modal__title"></h2>
        <button type="button" class="modal__close" data-close aria-label="Đóng">✕</button>
      </header>
      <div class="modal__body" id="modal-body"></div>
      <footer class="modal__foot" id="modal-foot"></footer>
    </div>
  </dialog>

  <noscript>Trò chơi cần bật JavaScript.</noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
