<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" role="img" aria-label="Chân dung ông Hà Quang Tín">
  <!-- Di ảnh: tông xám trầm, dải băng đen ở góc -->
  <rect width="200" height="240" fill="#3b414b"/>
  <circle cx="100" cy="98" r="80" fill="#4a515c"/>
  <!-- Áo gi-lê nâu + sơ mi trắng -->
  <path d="M18 240 C22 188 58 168 100 168 C142 168 178 188 182 240Z" fill="#6a5340"/>
  <path d="M78 168 L100 214 L122 168 C114 165 86 165 78 168Z" fill="#eeeae1"/>
  <path d="M86 166 L100 186 L114 166 L108 162 L100 174 L92 162Z" fill="#ffffff"/>
  <circle cx="100" cy="200" r="2" fill="#bdb6a8"/>
  <circle cx="100" cy="214" r="2" fill="#bdb6a8"/>
  <!-- Cổ -->
  <path d="M85 138 h30 v28 c-8 8 -22 8 -30 0z" fill="#cfa684"/>
  <!-- Tai + mặt -->
  <ellipse cx="61" cy="108" rx="7" ry="11" fill="#cfa684"/>
  <ellipse cx="139" cy="108" rx="7" ry="11" fill="#cfa684"/>
  <ellipse cx="100" cy="102" rx="39" ry="48" fill="#d8b190"/>
  <path d="M64 118 C68 144 84 150 100 150 C116 150 132 144 136 118 C128 140 114 144 100 144 C86 144 72 140 64 118Z" fill="#000" opacity=".08"/>
  <!-- Tóc bạc hai bên, trán hói -->
  <path d="M61 104 C57 78 64 64 76 58 L78 82 C70 86 65 94 64 106Z" fill="#c9c6bf"/>
  <path d="M139 104 C143 78 136 64 124 58 L122 82 C130 86 135 94 136 106Z" fill="#c9c6bf"/>
  <path d="M84 58 q16 -6 32 0" stroke="#c9c6bf" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Nếp nhăn trán -->
  <path d="M84 76 q16 -4 32 0 M88 84 q12 -3 24 0" stroke="#b08a6c" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <!-- Lông mày -->
  <path d="M75 96 q9 -4 18 0 M107 96 q9 -4 18 0" stroke="#9c958a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <!-- Mắt -->
  <ellipse cx="85" cy="108" rx="3.2" ry="3.6" fill="#1d1d1f"/>
  <ellipse cx="115" cy="108" rx="3.2" ry="3.6" fill="#1d1d1f"/>
  <!-- Kính tròn -->
  <circle cx="85" cy="108" r="11" fill="#ffffff" fill-opacity=".08" stroke="#2c2c2c" stroke-width="2.5"/>
  <circle cx="115" cy="108" r="11" fill="#ffffff" fill-opacity=".08" stroke="#2c2c2c" stroke-width="2.5"/>
  <path d="M96 107 q4 -3 8 0 M74 106 l-12 -2 M126 106 l12 -2" stroke="#2c2c2c" stroke-width="2.5" fill="none"/>
  <!-- Mũi, miệng -->
  <path d="M100 112 q-4 11 0 14 q3 1 5 -1" stroke="#a8805f" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <path d="M90 134 q10 3 20 0" stroke="#7a4b3c" stroke-width="2.8" fill="none" stroke-linecap="round"/>
  <!-- Băng tang -->
  <path d="M138 0 H170 L200 30 V62Z" fill="#111317"/>
</svg>
